<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Diagnóstico</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1a19; color: #fff; font: 12px/1.35 ui-monospace, Menlo, monospace; }
  .mark { position: fixed; left: 0; right: 0; height: 0; border-top: 1px solid rgba(255,255,255,.55); z-index: 1; }
  .mark span { position: absolute; right: 6px; top: 1px; font-size: 10px; color: #ffd166; }
  .bar { position: fixed; left: 0; right: 0; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; z-index: 3; }
  #top { top: 0; background: #118ab2; }
  #bottom { bottom: 0; background: #e63946; }
  #bottomNeg { bottom: calc(-1 * env(safe-area-inset-top, 0px)); background: #06d6a0; color: #000; }
  #panel { position: fixed; top: 90px; left: 8px; right: 8px; z-index: 2; background: rgba(0,0,0,.78); padding: 8px; border-radius: 8px; white-space: pre-wrap; }
  a { color: #9be7ff; }
</style>
</head>
<body>
<div id="marks"></div>
<div class="bar" id="top">top:0</div>
<div class="bar" id="bottom">bottom:0 (fixed)</div>
<div class="bar" id="bottomNeg" style="bottom:calc(-1 * env(safe-area-inset-top, 0px) + 40px)">bottom: -safe-top + 40px</div>
<div id="panel">midiendo…</div>
<script>
  const marksBox = document.getElementById('marks')
  for (let y = 100; y <= screen.height + 100; y += 50) {
    const m = document.createElement('div')
    m.className = 'mark'
    m.style.top = y + 'px'
    m.innerHTML = '<span>y=' + y + '</span>'
    marksBox.appendChild(m)
  }

  const probe = (css, prop) => {
    const d = document.createElement('div')
    d.style.cssText = 'position:fixed;visibility:hidden;' + css
    document.body.appendChild(d)
    const value = prop === 'h' ? d.getBoundingClientRect().height : getComputedStyle(d)[prop]
    d.remove()
    return value
  }

  function measure() {
    const vv = window.visualViewport
    const rows = {
      modo: (navigator.standalone === true || matchMedia('(display-mode: standalone)').matches) ? 'PWA instalada (standalone)' : 'navegador',
      'innerWidth x innerHeight': innerWidth + ' x ' + innerHeight,
      'outerHeight': outerHeight,
      'screen w x h': screen.width + ' x ' + screen.height,
      'screen.availHeight': screen.availHeight,
      'documentElement.clientHeight': document.documentElement.clientHeight,
      'visualViewport h / offsetTop': vv ? (vv.height + ' / ' + vv.offsetTop + ' (scale ' + vv.scale + ')') : 'n/d',
      'safe-area top': probe('padding-top:env(safe-area-inset-top,0px)', 'paddingTop'),
      'safe-area bottom': probe('padding-bottom:env(safe-area-inset-bottom,0px)', 'paddingBottom'),
      '100vh': probe('top:0;height:100vh', 'h'),
      '100dvh': probe('top:0;height:100dvh', 'h'),
      '100svh': probe('top:0;height:100svh', 'h'),
      '100lvh': probe('top:0;height:100lvh', 'h'),
      'fixed inset:0 alto': probe('inset:0', 'h'),
      '#bottom (rect.bottom)': Math.round(document.getElementById('bottom').getBoundingClientRect().bottom),
      pixelRatio: devicePixelRatio,
    }
    document.getElementById('panel').textContent =
      Object.entries(rows).map(([k, v]) => k + ': ' + v).join('\n') +
      '\n\nLinea blanca "y=N" = N px desde arriba.\nBarra roja = fixed bottom:0.\nBarra verde = fixed, 40px sobre el borde de la zona de seguridad.\nHaz captura de pantalla y mándala.'
  }
  measure()
  setInterval(measure, 1000)
  addEventListener('resize', measure)
</script>
<p style="position:fixed;top:34px;left:8px;z-index:4;margin:0"><a href="/">&larr; Volver a Clipo</a></p>
</body>
</html>
